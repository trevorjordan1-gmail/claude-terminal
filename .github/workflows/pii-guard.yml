# pii-guard — two protections on every push:
#
# 1. Author identity: pushes to main whose commits carry any author/committer
#    other than the repo owner are REWRITTEN in place (mailmap + force-push) —
#    the owner sometimes commits from a box whose global git identity differs.
#    Dev clones then need a one-time `git fetch && git reset --hard origin/main`
#    (get.sh does this automatically on bootstrapped boxes). Pushes made with
#    the workflow's own token don't re-trigger workflows, so this cannot loop.
#    On non-main branches this fails instead of fixing.
#
# 2. Private denylist: fails the run (GitHub emails the owner) when any commit's
#    diff or message matches a pattern from the PII_PATTERNS repo secret (one
#    grep -E pattern per line). Patterns live only in that secret, and on a hit
#    this job prints commit SHAs only, never the matched text, because public
#    Actions logs are world-readable.
name: pii-guard

on: [push]

permissions:
  contents: write

concurrency:
  group: pii-guard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Author identity — auto-fix on main, fail elsewhere
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bad=$(git log --format='%ae%n%ce' HEAD | sort -u | grep -vx 'trevorjordan1@gmail.com' || true)
          if [ -z "$bad" ]; then
            echo "author check clean"
            exit 0
          fi
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Commits with unexpected author/committer on this branch. Fix the clone that made them: git config user.name trevorjordan1-gmail; git config user.email trevorjordan1@gmail.com"
            exit 1
          fi
          echo "::notice::Unexpected author/committer identities found — rewriting to trevorjordan1-gmail and force-pushing."
          pip install --quiet git-filter-repo
          while read -r e; do
            printf 'trevorjordan1-gmail <trevorjordan1@gmail.com> <%s>\n' "$e"
          done <<< "$bad" > "$RUNNER_TEMP/mailmap"
          git filter-repo --force --mailmap "$RUNNER_TEMP/mailmap"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          echo "::notice::History rewritten. Dev clones: git fetch && git reset --hard origin/main"

      - name: Private denylist scan (diffs + messages, full history)
        env:
          PII_PATTERNS: ${{ secrets.PII_PATTERNS }}
        run: |
          if [ -z "$PII_PATTERNS" ]; then
            echo "PII_PATTERNS secret not set — skipping (expected on forks)."
            exit 0
          fi
          printf '%s\n' "$PII_PATTERNS" > "$RUNNER_TEMP/patterns"
          hits=0
          while read -r commit; do
            if git show "$commit" --format='%B' | grep -qiEf "$RUNNER_TEMP/patterns"; then
              echo "::error::Denylist hit in commit $commit (diff or message) — scan it locally; matched text is never printed here."
              hits=1
            fi
          done < <(git rev-list --all)
          [ "$hits" -eq 0 ] && echo "denylist scan clean"
          exit "$hits"
