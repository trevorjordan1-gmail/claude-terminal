<!doctype html>
<html lang="en" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google" content="notranslate">
<title>{{ brand }}</title>
<style>
  :root { --bg:#0f1420; --card:#1a2233; --text:#e8ecf4; --muted:#8b96ab;
          --accent:#4f8ef7; --ok:#3fb68b; --warn:#e0a63f; --bad:#e06060; --line:#2a3550; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--text);
         font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;
         max-width:860px; margin:0 auto; padding:2rem 1rem; }
  header { display:flex; justify-content:space-between; align-items:baseline;
           margin-bottom:1.5rem; border-bottom:1px solid var(--line); padding-bottom:1rem; }
  h1 { font-size:1.15rem; letter-spacing:.02em; }
  h1 span { color:var(--accent); }
  h2 { font-size:.85rem; text-transform:uppercase; letter-spacing:.08em;
       color:var(--muted); margin:1.5rem 0 .5rem; }
  .who { color:var(--muted); font-size:.85rem; }
  .who a { color:var(--muted); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px;
          padding:1rem 1.25rem; margin-bottom:.75rem;
          display:flex; align-items:center; gap:1rem; flex-wrap:wrap; }
  .card .meta { flex:1; min-width:200px; }
  .card .name { font-weight:600; }
  .card .sub { color:var(--muted); font-size:.85rem; }
  .state { font-size:.75rem; padding:.15rem .6rem; border-radius:99px;
           border:1px solid var(--line); color:var(--muted); }
  .state.running { color:var(--ok); border-color:var(--ok); }
  .state.stopped { color:var(--muted); }
  .state.paused { color:var(--accent); border-color:var(--accent); }
  .state.pending, .state.stopping { color:var(--warn); border-color:var(--warn); }
  .state.failed { color:var(--bad); border-color:var(--bad); }
  button[disabled] { opacity:.45; cursor:default; }
  button, .btn { background:var(--accent); color:#fff; border:0; border-radius:7px;
           padding:.45rem .9rem; font-size:.85rem; cursor:pointer; text-decoration:none; }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--muted); }
  form.inline { display:inline; }
  .share { width:100%; display:flex; gap:.5rem; align-items:center;
           border-top:1px solid var(--line); padding-top:.7rem; margin-top:.3rem; }
  input[type=email], input[type=text], select { background:var(--bg); color:var(--text);
           border:1px solid var(--line); border-radius:7px; padding:.4rem .6rem; font-size:.85rem; }
  .note { color:var(--muted); font-size:.85rem; margin-top:1rem; }
  .prog { width:100%; height:6px; background:var(--bg); border-radius:99px; overflow:hidden; }
  .prog-fill { height:100%; background:var(--accent); border-radius:99px; transition:width .5s; }
  .banner { background:var(--card); border:1px solid var(--accent); border-radius:10px;
            padding:.7rem 1.25rem; margin-bottom:1rem; font-size:.9rem; }
  a { color:var(--accent); }
</style>
</head>
<body>
<header>
  {%- set brand_parts = brand.rsplit(" ", 1) %}
  <h1>{% if brand_parts|length > 1 %}{{ brand_parts[0] }} <span>{{ brand_parts[1] }}</span>{% else %}{{ brand }}{% endif %}</h1>
  {% if user %}<div class="who">{{ user.name or user.upn }} · <a href="/logout">sign out</a></div>{% endif %}
</header>
{% block content %}{% endblock %}
</body>
</html>
